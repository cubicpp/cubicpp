name: Refresh profile visuals
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/refresh.py, scripts/arcade.mjs, 'scripts/vendor/**', .github/workflows/profile.yml]
permissions:
  contents: read
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: cubicpp
          outputs: |
            assets/snake-light.svg?palette=github
            assets/snake-dark.svg?palette=github-dark
      - name: Refresh decorative capsules
        run: python3 scripts/refresh.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate 3D contribution statistics
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586 # 0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: cubicpp
      - name: Generate contribution arcade animations
        run: node scripts/arcade.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save updated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/ profile-3d-contrib/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh profile visuals"
          git push
